name: stats
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # push the data branch
  pages: write
  id-token: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: site/data
      - uses: astral-sh/setup-uv@v10.3.0
      # Every read uses the stats App's installation token, which has its own rate budget and
      # read access to the owner's repositories, private ones included. GITHUB_TOKEN only pushes
      # the data branch (the checkout above keeps it for that).
      - id: app
        uses: actions/create-github-app-token@v3.3.0
        continue-on-error: true
        with:
          app-id: ${{ vars.STATS_APP_ID }}
          private-key: ${{ secrets.STATS_APP_KEY }}
          owner: NaNIsaac
          # metadata read comes with any installation; traffic is the only use of administration
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-administration: read
      # A missing token fails the run in collect.py, which first marks latest.json as failed.
      - id: collect
        run: uv run collect.py site/data
        env:
          STATS_APP_TOKEN: ${{ steps.app.outputs.token }}
      # Also after a failed collect: latest.json then records why the data was not refreshed.
      - name: Commit data
        if: ${{ !cancelled() }}
        working-directory: site/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "chore: update stats" && git push; }
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
