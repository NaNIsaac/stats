name: stats
on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: data
          path: site/data
      - uses: astral-sh/setup-uv@v10.3.0
      # STATS_TOKEN must belong to the owner to see private repositories and traffic;
      # without it the run refreshes public data only.
      - run: uv run collect.py site/data
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
      - name: Commit data
        working-directory: site/data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -q -m "chore: update stats" && git push; }
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
